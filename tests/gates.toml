# The gate registry.
#
# One row for each gate of the design D0, section 9, that has been built. A row
# names the gate and what holds it. The `registry` stage of verify/run.sh fails
# by name in both directions: a row nothing claims, and a test claiming a gate
# that has no row.
#
#   name     this project's short name for the gate, lower case with hyphens
#   d0       the gate's name in D0's section 9, exactly as written there
#   kind     "pytest": tests named  test_gate_<name>__*  hold it, and tests named
#                      test_control_<name>__*  are its negative controls
#                      (a hyphen in <name> is written as an underscore)
#            "stage":  a stage of verify/run.sh holds it; `test` and `control`
#                      name the stage and its control stage
#
# A parcel adds its rows in the same commit as the tests that claim them, so
# this stage passes at every commit.

[[gate]]
name = "generated-copies"
d0 = "generated copies"
kind = "stage"
test = "generated"
control = "ctl-generated"

# MOD-A: the source and the injector. Tests in tests/test_mod_a_inject.py,
# tests/test_mod_a_source.py and tests/test_mod_a_tails.py.
[[gate]]
name = "injection"
d0 = "injection"
kind = "pytest"

[[gate]]
name = "replay"
d0 = "replay"
kind = "pytest"

[[gate]]
name = "noise-tails"
d0 = "noise tails"
kind = "pytest"

# MOD-B: the detector core, the weight store and the scorer (model/detector.py, model/weights.py, model/scorer.py).

[[gate]]
name = "reference-model"
d0 = "reference model"
kind = "pytest"

[[gate]]
name = "swap"
d0 = "swap"
kind = "pytest"

[[gate]]
name = "refusal"
d0 = "refusal"
kind = "pytest"

[[gate]]
name = "overflow"
d0 = "overflow"
kind = "pytest"

[[gate]]
name = "scorer"
d0 = "scorer"
kind = "pytest"

# STAT. The measured efficiency of a correct matched filter is inside the stated
# tolerance of D8; a filter wrong by a stated margin, a rectified detector, and a
# tolerance of the wrong width are each reported. docs/model/stat.md has the limits.
[[gate]]
name = "statistics"
d0 = "statistics"
kind = "pytest"

# SEAM, the lead's: where the injector meets the detector (model/run.py). The same samples under
# other truth records give the same score records; a runner that lets one bit of truth reach the
# detector is reported. Tests in tests/test_seam_isolation.py.
[[gate]]
name = "truth-isolation"
d0 = "truth isolation"
kind = "pytest"

# LRN-A: the comparison rules of D0's section 8, held on stage E1 in software (tests/test_lrn_a_e1.py).
# A run on an injection set that is not the committed one, a figure read from frames the learner trained
# on, a threshold kept across a weight change, a comparison at an equal threshold, and a report of a model
# that is not the named one are each refused. docs/model/lrn-a.md has the limits.
[[gate]]
name = "comparison-rules"
d0 = "comparison rules"
kind = "pytest"

# RTL-B: the detector core and its weight store in simulation (rtl/core/, docs/rtl/core.md). The first of
# this gate's three parts, RTL in simulation; the host and the card are later rounds'. The stage runs every
# bench of rtl/tb/benches.toml against the reference model on every score word. Its control stage is the
# control on the JUDGE (tools/check_rtl.py) and plants nothing in the core's benches: the controls on those
# are their mutants, which run inside the stage itself.
[[gate]]
name = "bit-identity"
d0 = "bit identity"
kind = "stage"
test = "rtl-benches"
control = "ctl-rtl-benches"

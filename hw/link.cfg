# v++ link configuration for the U50's HBM platform. Parcel KRNL, round 3; docs/rtl/krnl.md.
#
# One compute unit; its one master, m_axi_gmem, to one HBM pseudo-channel, as the
# sibling project's <repos>/cft-fp256/hw/link.cfg gives each of its masters one
# (read there; that file's reasons are its own). The score records of a run of
# 2^20 frames are 32 MiB, inside one pseudo-channel.
#
# The clock is the build's to ask (--kernel_frequency on the v++ command line,
# 100 MHz by the round's plan), not this file's. tests/test_krnl_packaging.py
# holds the kernel's name and its port's name here to hw/kernel.xml.
#
# [vivado], the lead's, 2026-11-24. CASCADE_DSP is the kernel's synthesis run's
# property for synth_design's -cascade_dsp, which Vivado 2022.2's own help gives
# as "Controls how adders summing DSP block outputs will be implemented. Value:
# auto, tree, force"; its default is auto. With tree such sums are fabric adders.
# The lead set it after the first link failed in placement ("The height of the
# device or SLR DSP column is 110 DSPs"), reading the refused chain as the core's
# row sum. That reading was wrong: the chain was the delay line carried through
# the DSP blocks' B cascade, which this property does not touch, and the second
# link met the same refusal (docs/rtl/krnl.md, the paragraph on the first links;
# the fix is the attribute keep on the delay line in rtl/core/core.sv). It stays:
# it removed the two-block chains of the wide products, and it changes how the
# same RTL is mapped, not what it computes. The run's name is the one v++ gave
# that synthesis.

[connectivity]
nk=undertone_krnl:1:undertone_krnl_1
sp=undertone_krnl_1.m_axi_gmem:HBM[0]

[vivado]
prop=run.ulp_undertone_krnl_1_0_synth_1.STEPS.SYNTH_DESIGN.ARGS.CASCADE_DSP=tree

# v++ link configuration for the U50's HBM platform. Parcel KRNL, round 3; docs/rtl/krnl.md.
#
# One compute unit; its one master, m_axi_gmem, to one HBM pseudo-channel, as the
# sibling project's <repos>/cft-fp256/hw/link.cfg gives each of its masters one
# (read there; that file's reasons are its own). The score records of a run of
# 2^20 frames are 32 MiB, inside one pseudo-channel.
#
# The clock is the build's to ask (--kernel_frequency on the v++ command line,
# 100 MHz by the round's plan), not this file's. NOTHING HAS RUN THIS FILE: the
# link is the lead's, in BUILD. tests/test_krnl_packaging.py holds the kernel's
# name and its port's name here to hw/kernel.xml.

[connectivity]
nk=undertone_krnl:1:undertone_krnl_1
sp=undertone_krnl_1.m_axi_gmem:HBM[0]

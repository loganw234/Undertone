# v++ link configuration for the U50's HBM platform. Parcel KRNL, round 3; docs/rtl/krnl.md.
#
# One compute unit; its one master, m_axi_gmem, to one HBM pseudo-channel, as the
# sibling project's <repos>/cft-fp256/hw/link.cfg gives each of its masters one
# (read there; that file's reasons are its own). The score records of a run of
# 2^20 frames are 32 MiB, inside one pseudo-channel.
#
# The clock is the build's to ask (--kernel_frequency on the v++ command line,
# 100 MHz by the round's plan), not this file's. tests/test_krnl_packaging.py
# holds the kernel's name and its port's name here to hw/kernel.xml.
#
# [vivado], the lead's, 2026-11-24. The first link of the frozen RTL (955284c)
# failed in placement: synthesis had built the core's sum of a row's 128 products
# (rtl/core/core.sv, stage s3) as one cascade of DSP blocks through their PCIN
# ports, and Vivado refused it, "The height of the device or SLR DSP column is
# 110 DSPs" (CRITICAL WARNING Shape Builder 18-434, then VPL 18-435 and 30-99).
# CASCADE_DSP is the kernel's synthesis run's property for synth_design's
# -cascade_dsp, which Vivado 2022.2's own help gives as "Controls how adders
# summing DSP block outputs will be implemented. Value: auto, tree, force";
# its default is auto. With tree the sum is made of adders in the fabric. It
# changes how the same RTL is mapped, not what it computes: the card's records,
# compared word for word with the model's, are what says so. The run's name is
# the one v++ gave that synthesis in the failed link.

[connectivity]
nk=undertone_krnl:1:undertone_krnl_1
sp=undertone_krnl_1.m_axi_gmem:HBM[0]

[vivado]
prop=run.ulp_undertone_krnl_1_0_synth_1.STEPS.SYNTH_DESIGN.ARGS.CASCADE_DSP=tree

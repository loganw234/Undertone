<text class="muted" fill="#57606a" font-size="12" text-anchor="start" x="16.00" y="46.00">The share of each kind of window with a record in which the study's frozen rule found a hit,</text>
<text class="muted" fill="#57606a" font-size="12" text-anchor="start" x="16.00" y="62.00">at each of its stations, nearest the pad first. Each bar carries its hits and its windows.</text>
<text class="muted" fill="#57606a" font-size="12" text-anchor="start" x="16.00" y="78.00">Authority: neither. Each study's own rule and Fisher's exact test; no detector was run.</text>

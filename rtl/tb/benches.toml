# The benches the `rtl-benches` stage runs, and each bench's RTL mutants.
#
# A bench is one cocotb module run on one top-level design, once under each
# profile it names: the runner builds the design with that profile's
# SAMPLE_BITS and CHANNELS as parameters and sets UNDERTONE_PROFILE.
#
#   name      lower case letters, digits and hyphens
#   toplevel  the design's top module, which keeps the stream contract of
#             rtl/tb/harness.py and takes the parameters SAMPLE_BITS and CHANNELS
#   sources   the design's files, in compile order, as paths from the root
#   module    the cocotb module, a file rtl/tb/<module>.py
#   profiles  the profiles to run under
#   identity  the tests that hold the design against the model through
#             harness.compare. Each must pass AND leave evidence of records
#             compared; the stage adds the records up
#
# A mutant is a negative control on the RTL side: exact pieces of one source
# file replaced, in a copy, and the bench run on the copy.
#
#   edits      [[old, new], ...], applied in order. Each `old` must occur in
#              the file exactly once when its turn comes: a mutant that no
#              longer applies fails the stage
#   must_fail  the tests that must fail on the copy
#   kind       WORD, COUNT or UNKNOWN-BITS: the harness must have left a
#              MISMATCH of that kind for each of those tests. Empty: the
#              failure alone is asked
#
# A mutant shows that the bench sees THAT fault. It says nothing of others.

[[bench]]
name = "p0-onetap"
toplevel = "onetap"
sources = ["spec/undertone_pkg.sv", "rtl/p0/onetap.sv"]
module = "bench_p0_onetap"
profiles = ["s16x1", "s24x3"]
identity = ["bit_identity_random", "bit_identity_extremes"]

# One flipped coefficient bit in the RTL: the lowest bit of every channel's coefficient.
[[bench.mutant]]
name = "coefficient-bit"
file = "rtl/p0/onetap.sv"
edits = [["$signed(cfg_coef[c*COEFF_BITS +: COEFF_BITS]);", "$signed(cfg_coef[c*COEFF_BITS +: COEFF_BITS] ^ 18'd1);"]]
must_fail = ["bit_identity_random", "bit_identity_extremes"]
kind = "WORD"

# The classic: a logical shift where the model's is arithmetic.
[[bench.mutant]]
name = "shift-logical"
file = "rtl/p0/onetap.sv"
edits = [["score = a >>> cfg_shift;", "score = $signed({1'b0, a} >> cfg_shift);"]]
must_fail = ["bit_identity_random", "bit_identity_extremes"]
kind = "WORD"

# The record's other fields: an index that starts at one, and a flag bit set.
[[bench.mutant]]
name = "index-from-one"
file = "rtl/p0/onetap.sv"
edits = [["index      <= '0;", "index      <= 64'd1;"]]
must_fail = ["bit_identity_random", "bit_identity_extremes"]
kind = "WORD"

[[bench.mutant]]
name = "flag-set"
file = "rtl/p0/onetap.sv"
edits = [["<= cfg_epoch;", "<= cfg_epoch; out_record[SCORE_FLAGS_LSB] <= 1'b1;"]]
must_fail = ["bit_identity_random", "bit_identity_extremes"]
kind = "WORD"

# A design that stops putting records out: every word it gave is right, and there are too few.
[[bench.mutant]]
name = "stops-after-four"
file = "rtl/p0/onetap.sv"
edits = [["out_valid <= in_valid;", "out_valid <= in_valid && (index < 4);"]]
must_fail = ["bit_identity_random", "bit_identity_extremes"]
kind = "COUNT"

# The other direction: a design that puts out one record too many. Four idle clocks after its last
# frame it repeats its last record. Between frames the bench leaves at most two idle clocks, so this
# fires once, after the stream's end, and every word before it is right.
[[bench.mutant]]
name = "one-too-many"
file = "rtl/p0/onetap.sv"
edits = [
    ["    logic        [SCORE_INDEX_BITS-1:0] index;", "    logic        [SCORE_INDEX_BITS-1:0] index;\n    logic [2:0] idle;"],
    ["out_valid  <= 1'b0;", "out_valid  <= 1'b0; idle <= 3'd7;"],
    ["out_valid <= in_valid;", "out_valid <= in_valid || (idle == 3'd3); idle <= in_valid ? 3'd0 : ((idle == 3'd7) ? 3'd7 : idle + 3'd1);"],
]
must_fail = ["bit_identity_random", "bit_identity_extremes"]
kind = "COUNT"

# A design one clock later than it says: every record goes through one more register. The harness
# does not check latency, so this mutant is NOT asked to fail the identity tests; the test that
# states the latency must fail.
[[bench.mutant]]
name = "one-clock-late"
file = "rtl/p0/onetap.sv"
edits = [
    ["    logic        [SCORE_INDEX_BITS-1:0] index;", "    logic        [SCORE_INDEX_BITS-1:0] index;\n    logic late_valid;\n    logic [SCORE_RECORD_BITS-1:0] late_record;"],
    ["out_valid  <= 1'b0;", "out_valid  <= 1'b0; late_valid <= 1'b0;"],
    ["out_valid <= in_valid;", "late_valid <= in_valid; out_valid <= late_valid; out_record <= late_record;"],
    ["out_record                                            <= '0;", "late_record <= '0;"],
    ["out_record[SCORE_INDEX_LSB +: SCORE_INDEX_BITS]       <= index;", "late_record[SCORE_INDEX_LSB +: SCORE_INDEX_BITS] <= index;"],
    ["out_record[SCORE_EPOCH_LSB +: SCORE_EPOCH_BITS]       <= cfg_epoch;", "late_record[SCORE_EPOCH_LSB +: SCORE_EPOCH_BITS] <= cfg_epoch;"],
    ["out_record[SCORE_SCORE_LSB +: SCORE_SCORE_BITS]       <= score;", "late_record[SCORE_SCORE_LSB +: SCORE_SCORE_BITS] <= score;"],
]
must_fail = ["latency_is_one_clock"]
kind = ""

# ---- parcel RTL-A: the source, and the injector ----
#
# Each bench has two rows, one a profile: the bench runs under both sample formats, and EVERY MUTANT
# RUNS UNDER ONE (the lead's ruling of 2026-11-23, for the stage's length). A mutant shows that the
# bench sees its fault under that one sample format. None of these faults depends on the format.
#
# The refusals have two mutants a module, not two a name: one that refuses nothing, and one that
# names every refusal wrongly. Each must fail EVERY refusal test of its bench, one test a name. So
# each name's test is seen to fail with its refusal absent and again with its number wrong. What that
# concedes: no mutant removes ONE name's check and leaves the others.

# The source. The generator is held on its words, all 64 bits, and not through the table: a sample is
# a lossy view of a word. Its three constants are typed once in rtl/source/source.sv and once in
# model/source.py; the definition does not hold them. The six constant mutants and the test they fail do.

[[bench]]
name = "source-s16x1"
toplevel = "source"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv"]
module = "bench_source"
profiles = ["s16x1"]
identity = ["words_are_the_models", "frames_are_the_models", "every_boundary_is_reached", "the_widest_table_runs", "refusal_noise_range", "refusal_register_access"]

# One bit of the increment: its lowest.
[[bench.mutant]]
name = "gamma-bit0"
file = "rtl/source/source.sv"
edits = [["64'h9E3779B97F4A7C15", "64'h9E3779B97F4A7C14"]]
must_fail = ["words_are_the_models"]
kind = "WORD"

# The highest bit of the first mixing constant. It changes a product only in its top bit, and only
# when the multiplicand is odd: a multiply right in its low half.
[[bench.mutant]]
name = "mix1-bit63"
file = "rtl/source/source.sv"
edits = [["64'hBF58476D1CE4E5B9", "64'h3F58476D1CE4E5B9"]]
must_fail = ["words_are_the_models"]
kind = "WORD"

[[bench.mutant]]
name = "mix2-bit0"
file = "rtl/source/source.sv"
edits = [["64'h94D049BB133111EB", "64'h94D049BB133111EA"]]
must_fail = ["words_are_the_models"]
kind = "WORD"

# A table one entry short: the search never counts the table's last entry, so the largest magnitude
# never comes out. No drawn seed reaches that entry; the test builds the seeds that do.
[[bench.mutant]]
name = "table-one-entry-short"
file = "rtl/source/source.sv"
edits = [["(cand <= table_len)", "(cand < table_len)"]]
must_fail = ["every_boundary_is_reached"]
kind = "WORD"

# A source that refuses nothing: a table longer than the build holds is taken, and no refusal is
# ever latched.
[[bench.mutant]]
name = "refuses-nothing"
file = "rtl/source/source.sv"
edits = [
    ["if (reg_wdata > LARGEST) wr_code   = CODE_NOISE_RANGE;", "if (1'b0) wr_code   = CODE_NOISE_RANGE;"],
    ["refusal <= wr_code;", "refusal <= 8'd0;"],
]
must_fail = ["refusal_noise_range", "refusal_register_access"]
kind = "WORD"

[[bench]]
name = "source-s24x3"
toplevel = "source"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv"]
module = "bench_source"
profiles = ["s24x3"]
identity = ["words_are_the_models", "frames_are_the_models", "every_boundary_is_reached", "the_widest_table_runs", "refusal_noise_range", "refusal_register_access"]

# The highest bit of the increment.
[[bench.mutant]]
name = "gamma-bit63"
file = "rtl/source/source.sv"
edits = [["64'h9E3779B97F4A7C15", "64'h1E3779B97F4A7C15"]]
must_fail = ["words_are_the_models"]
kind = "WORD"

[[bench.mutant]]
name = "mix1-bit0"
file = "rtl/source/source.sv"
edits = [["64'hBF58476D1CE4E5B9", "64'hBF58476D1CE4E5B8"]]
must_fail = ["words_are_the_models"]
kind = "WORD"

[[bench.mutant]]
name = "mix2-bit63"
file = "rtl/source/source.sv"
edits = [["64'h94D049BB133111EB", "64'h14D049BB133111EB"]]
must_fail = ["words_are_the_models"]
kind = "WORD"

# A source that names every refusal wrongly: the number latched has its lowest bit flipped, which is
# another declared name's number each time.
[[bench.mutant]]
name = "every-refusal-misnamed"
file = "rtl/source/source.sv"
edits = [["refusal <= wr_code;", "refusal <= wr_code ^ 8'd1;"]]
must_fail = ["refusal_noise_range", "refusal_register_access"]
kind = "WORD"

# A source that drops the upper word of src_frames: a count of 2^32 + 3 runs three frames, and a count
# of exactly 2^32 does not run. The lead planted it in the verifier's clone and the gate passed it: no
# test asked for a count past 32 bits. This mutant is that fault, kept so the gate is shown to see it.
[[bench.mutant]]
name = "frames-upper-word-dropped"
file = "rtl/source/source.sv"
edits = [
    ["frames_left <= {reg_wdata, frames_low};", "frames_left <= {WORD_ZERO, frames_low};"],
    ["if ({reg_wdata, frames_low} != FRAMES_ZERO) running <= 1'b1;", "if (frames_low != WORD_ZERO) running <= 1'b1;"],
]
must_fail = ["frames_are_the_models"]
kind = "WORD"

# The injector.

[[bench]]
name = "inject-s16x1"
toplevel = "inject"
sources = ["spec/undertone_pkg.sv", "rtl/inject/inject.sv"]
module = "bench_inject"
profiles = ["s16x1"]
identity = ["stream_is_the_models", "ties_go_to_the_even", "records_that_touch_and_the_ends", "a_run_begun_far_out", "wide_amplitudes", "other_truth_same_samples", "refusal_record_field", "refusal_pulse_unknown", "refusal_inject_overlap", "refusal_inject_pending", "refusal_inject_range", "refusal_register_access"]

# Two of the four of the design D0: an injector that adds nothing, and one with the sign flipped.
# On a schedule whose amplitudes are not zero.
[[bench.mutant]]
name = "adds-nothing"
file = "rtl/inject/inject.sv"
edits = [["r_delta <= delta;", "r_delta <= '0;"]]
must_fail = ["stream_is_the_models"]
kind = "WORD"

[[bench.mutant]]
name = "sign-flipped"
file = "rtl/inject/inject.sv"
edits = [["assign delta = neg_last ? (~magr + 1'b1) : magr;", "assign delta = neg_last ? magr : (~magr + 1'b1);"]]
must_fail = ["stream_is_the_models"]
kind = "WORD"

# The fifth: a tie rounded upward, where the rule says to the even integer.
[[bench.mutant]]
name = "tie-upward"
file = "rtl/inject/inject.sv"
edits = [["((twice == den_wide) && q_last[0])", "(twice == den_wide)"]]
must_fail = ["ties_go_to_the_even"]
kind = "WORD"

# An injector that names every refusal wrongly: the number latched has its lowest bit flipped.
[[bench.mutant]]
name = "every-refusal-misnamed"
file = "rtl/inject/inject.sv"
edits = [["refusal <= new_code;", "refusal <= new_code ^ 8'd1;"]]
must_fail = ["refusal_record_field", "refusal_pulse_unknown", "refusal_inject_overlap", "refusal_inject_pending", "refusal_inject_range", "refusal_register_access"]
kind = "WORD"

# An injector that refuses a sum EQUAL to the largest sample. Parcel RTL-A's own pass of one-place
# changes found that no test held the range at either end; this mutant and its mirror in the other
# row are that fault, kept here so that the gate is shown to see it.
[[bench.mutant]]
name = "largest-sample-refused"
file = "rtl/inject/inject.sv"
edits = [["if (s < SMIN || s > SMAX) any_bad = 1'b1;", "if (s < SMIN || s >= SMAX) any_bad = 1'b1;"]]
must_fail = ["refusal_inject_range"]
kind = "WORD"

[[bench]]
name = "inject-s24x3"
toplevel = "inject"
sources = ["spec/undertone_pkg.sv", "rtl/inject/inject.sv"]
module = "bench_inject"
profiles = ["s24x3"]
identity = ["stream_is_the_models", "ties_go_to_the_even", "records_that_touch_and_the_ends", "a_run_begun_far_out", "wide_amplitudes", "other_truth_same_samples", "refusal_record_field", "refusal_pulse_unknown", "refusal_inject_overlap", "refusal_inject_pending", "refusal_inject_range", "refusal_register_access"]

# The other two of D0's four: an injector a sample late, and one at half amplitude.
[[bench.mutant]]
name = "one-sample-late"
file = "rtl/inject/inject.sv"
edits = [["assign diff   = s1_index - head_index;", "assign diff   = s1_index - head_index - 64'd1;"]]
must_fail = ["stream_is_the_models"]
kind = "WORD"

[[bench.mutant]]
name = "half-amplitude"
file = "rtl/inject/inject.sv"
edits = [["s2_den <= active ? head_den : DEN_ONE;", "s2_den <= active ? {head_den[DEN_BITS-2:0], 1'b0} : DEN_ONE;"]]
must_fail = ["stream_is_the_models"]
kind = "WORD"

# An injector that refuses nothing: every record offered is taken whatever it holds, a sum out of
# range is offered as it wraps, no run ends, and no refusal is ever latched.
[[bench.mutant]]
name = "refuses-nothing"
file = "rtl/inject/inject.sv"
edits = [
    ["end else if ((t_pulse >> TRUTH_PULSE_ID_BITS) != WORD_ZERO || reg_wdata == WORD_ZERO) begin", "end else if (1'b0) begin"],
    ["end else if (t_pulse != PULSE_E0_ID) begin", "end else if (1'b0) begin"],
    ["end else if ({1'b0, t_index} < free_from || t_index < n) begin", "end else if (1'b0) begin"],
    ["end else if (count == MAX_INJECT_PENDING) begin", "end else if (1'b0) begin"],
    ["if (wr_run_refused || range_refuse) dead <= 1'b1;", "if (1'b0) dead <= 1'b1;"],
    ["if (r_valid && !dead && !any_bad) begin", "if (r_valid && !dead) begin"],
    ["refusal <= new_code;", "refusal <= 8'd0;"],
]
must_fail = ["refusal_record_field", "refusal_pulse_unknown", "refusal_inject_overlap", "refusal_inject_pending", "refusal_inject_range", "refusal_register_access"]
kind = "WORD"

# An injector with truth in its timing: every frame after the first one that has a pulse on it goes
# through one register more, so it comes out 53 clocks after it went in, with every sample right. The
# verifier built it and nothing failed: no mutant was made to fail the latency's test. It names no kind:
# the words are the model's, and what fails is the test's own count of clocks.
[[bench.mutant]]
name = "one-register-more-after-a-pulse"
file = "rtl/inject/inject.sv"
edits = [
    ["logic                      any_bad, range_refuse;", "logic                      any_bad, range_refuse; logic late, x_valid; logic [W-1:0] x_frame;"],
    ["r_delta <= delta;", "r_delta <= delta; x_valid <= 1'b0;"],
    ["out_frame <= sum_frame;", "out_frame <= sum_frame; if (late) begin out_valid <= 1'b0; x_valid <= 1'b1; x_frame <= sum_frame; end if (r_delta != 0) late <= 1'b1;"],
    ["if (wr_run_refused || range_refuse) dead <= 1'b1;", "if (x_valid) begin out_valid <= 1'b1; out_frame <= x_frame; end if (wr_run_refused || range_refuse) dead <= 1'b1;"],
]
must_fail = ["latency_is_fifty_two_clocks"]
kind = ""

# The mirror of `largest-sample-refused`: an injector that refuses a sum equal to the smallest sample.
[[bench.mutant]]
name = "smallest-sample-refused"
file = "rtl/inject/inject.sv"
edits = [["if (s < SMIN || s > SMAX) any_bad = 1'b1;", "if (s <= SMIN || s > SMAX) any_bad = 1'b1;"]]
must_fail = ["refusal_inject_range"]
kind = "WORD"

# ---- Parcel RTL-B: the detector core and its weight store (docs/rtl/core.md) ----
#
# `core_small` is rtl/core/core.sv at small maxima: the runner hands a top two parameters and this
# file has no key for more, so a build below the definition's maxima is a top of its own. `core` is
# the same file at the definition's maxima.
#
# Each bench module has a row for each profile, so every test runs under both sample formats and
# EVERY MUTANT RUNS UNDER ONE (the lead's ruling of 2026-11-23: a mutant's run is a build of its own,
# and the stage has one budget). A mutant is under the profile where its fault can show at all, and
# otherwise they are split evenly. What that concedes: a mutant shows the bench sees its fault under
# one sample format.

[[bench]]
name = "core-s16x1"
toplevel = "core_small"
sources = ["spec/undertone_pkg.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/core/core_small.sv"]
module = "bench_core"
profiles = ["s16x1"]
identity = ["bit_identity_random", "bit_identity_every_tap", "bit_identity_swap", "bit_identity_swap_on_the_edge", "bit_identity_swap_at_zero", "bit_identity_extremes", "bit_identity_counters"]

# One flipped coefficient bit in the RTL, on the shape where every tap reaches the score: the lowest
# bit of row 0's newest-sample coefficient. (The top bit of another is under the other profile.)
[[bench.mutant]]
name = "coefficient-bit-low"
file = "rtl/core/core.sv"
edits = [["cx = cw;", "cx = ((r*B_TAPS + m) == 0) ? $signed(cw ^ {{(COEFF_BITS-1){1'b0}}, 1'b1}) : cw;"]]
must_fail = ["bit_identity_every_tap"]
kind = "WORD"

# A swap that changes half the taps a clock late: the newer half of every row reads the bank that the
# frame before named.
[[bench.mutant]]
name = "swap-half-taps-late"
file = "rtl/core/core.sv"
edits = [
    ["head_valid;", "head_valid;\n    logic sel_late;\n    always @(posedge clk) sel_late <= tg[ST_S1][TAG_SEL];"],
    ["cw = tg[ST_S1][TAG_SEL] ? coef_b[r*B_TAPS + m] : coef_a[r*B_TAPS + m];", "cw = ((m < B_TAPS/2) ? sel_late : tg[ST_S1][TAG_SEL]) ? coef_b[r*B_TAPS + m] : coef_a[r*B_TAPS + m];"],
]
must_fail = ["bit_identity_swap", "bit_identity_swap_on_the_edge"]
kind = "WORD"

# With a hidden layer: the head weights a clock after the hidden weights.
[[bench.mutant]]
name = "head-weights-late"
file = "rtl/core/core_head.sv"
edits = [
    ["// o[j] * b_j at index j", "// o[j] * b_j at index j\n    logic sel_late;\n    always @(posedge clk) sel_late <= h2_sel;"],
    ["ow = h2_sel ? $signed(out_b", "ow = sel_late ? $signed(out_b"],
]
must_fail = ["bit_identity_swap"]
kind = "WORD"

# A core one bit narrower at a stage, at the small top's own true extremes. The row sum, the pooled
# sum and the output sum wrap with no flag and are caught by the score; the hidden value raises the
# flag where the model does not.
[[bench.mutant]]
name = "narrow-row"
file = "rtl/core/core.sv"
edits = [["$clog2(B_TAPS + 1) + 1;", "$clog2(B_TAPS + 1);"]]
must_fail = ["bit_identity_extremes"]
kind = "WORD"

[[bench.mutant]]
name = "narrow-pool"
file = "rtl/core/core.sv"
edits = [["$clog2(B_POOL * PER * B_TAPS + 1) + 1;", "$clog2(B_POOL * PER * B_TAPS + 1);"]]
must_fail = ["bit_identity_extremes"]
kind = "WORD"

[[bench.mutant]]
name = "narrow-hidden-value"
file = "rtl/core/core_head.sv"
edits = [
    ["us[W_HEADX-1:W_HID-1]) || !(|us[W_HEADX-1:W_HID-1]", "us[W_HEADX-1:W_HID-2]) || !(|us[W_HEADX-1:W_HID-2]"],
    ["t  = us[W_HID-1:0];", "t  = $signed(us[W_HID-2:0]);"],
]
must_fail = ["bit_identity_extremes"]
kind = "WORD"

[[bench.mutant]]
name = "narrow-output"
file = "rtl/core/core_head.sv"
edits = [["$clog2(B_HIDDEN + 1) + 1;", "$clog2(B_HIDDEN + 1);"]]
must_fail = ["bit_identity_extremes"]
kind = "WORD"

# A pipeline one stage longer than the stated latency: every record goes through one more register.
# The harness does not check latency, so the test that states it is the one that must fail.
[[bench.mutant]]
name = "one-stage-longer"
file = "rtl/core/core.sv"
edits = [
    ["head_valid;", "head_valid;\n    logic late_valid = 1'b0;\n    logic [SCORE_RECORD_BITS-1:0] late_record = '0;"],
    ["out_valid <= vld[ST_H4];", "late_valid <= vld[ST_H4]; out_valid <= late_valid; out_record <= late_record;"],
    ["out_record <= rec_next;", "late_record <= rec_next;"],
]
must_fail = ["latency_is_eleven_clocks"]
kind = ''

# The shadow's closing, on one side of its last clock: not closed at all.
[[bench.mutant]]
name = "shadow-not-closed"
file = "rtl/core/core.sv"
edits = [["localparam int ST_CLOSED_LAST = ST_H1;", "localparam int ST_CLOSED_LAST = 0;"]]
must_fail = ["shadow_closes_and_opens"]
kind = "WORD"

# The index, on one side of the line the bench's written state draws: sixteen bits.
[[bench.mutant]]
name = "index-sixteen-bits"
file = "rtl/core/core.sv"
edits = [["index_n    = next_index + (take ? 1 : 0);", "index_n    = next_index + (take ? 1 : 0); index_n[SCORE_INDEX_BITS-1:16] = next_index[SCORE_INDEX_BITS-1:16];"]]
must_fail = ["bit_identity_counters"]
kind = "WORD"

# ---- beyond the brief's list: faults a verifier would try, each tried by the parcel first ----

# The first rounding as a logical shift, where the model's is arithmetic.
[[bench.mutant]]
name = "hidden-shift-logical"
file = "rtl/core/core_head.sv"
edits = [["us = ux >>> q;", "us = $signed({1'b0, ux} >> q);"]]
must_fail = ["bit_identity_random"]
kind = "WORD"

# The pool with no forwarding: with a pool of 1 on consecutive clocks it reads a word not yet written.
# What it reads is unknown, so the harness reports unknown bits, not a wrong word.
[[bench.mutant]]
name = "pool-no-forwarding"
file = "rtl/core/core.sv"
edits = [["s4_old  <= (vld[ST_S4] && (pool_wp == pool_rp)) ? s4_rect : pool_mem[pool_rp];", "s4_old  <= pool_mem[pool_rp];"]]
must_fail = ["bit_identity_swap_on_the_edge"]
kind = "UNKNOWN-BITS"


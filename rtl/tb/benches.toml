# ---------------------------------------------------------------------------------------------
# Parcel SEAM-2: the three blocks wired together. docs/rtl/seam.md says what each mutant shows.
# One row a profile, so that the bench runs under both and a mutant runs under one.
# Every mutant but one is a mutant of the top's wiring; `ratio-as-written` is a mutant of the
# injector, in a copy, since the ratio exists nowhere else.

[[bench]]
name = "seam-s16x1"
toplevel = "seam"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv", "rtl/inject/inject.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/seam/seam_core.sv", "rtl/seam/seam.sv"]
module = "bench_seam"
profiles = ["s16x1"]
identity = ["bit_identity_first_frames", "bit_identity_chain", "truth_isolation", "bit_identity_swap", "bit_identity_hand_over"]

# The injector bypassed: the core reads the source's frames.
[[bench.mutant]]
name = "injector-bypassed"
file = "rtl/seam/seam.sv"
edits = [[".in_valid(inj_valid),", ".in_valid(src_valid),"], [".in_frame(inj_frame),", ".in_frame(src_frame),"]]
must_fail = ["bit_identity_first_frames"]
kind = "WORD"

# A frame late between the source and the injector: the data a clock after its valid.
[[bench.mutant]]
name = "joint-one-data-late"
file = "rtl/seam/seam.sv"
edits = [["logic [W-1:0] inj_frame;", "logic [W-1:0] inj_frame;\n    logic [W-1:0] late_frame;\n    always_ff @(posedge clk) late_frame <= src_frame;"], [".in_frame(src_frame),", ".in_frame(late_frame),"]]
must_fail = ["bit_identity_first_frames"]
kind = "WORD"

# The other way round between the injector and the core: the valid a clock after its data. The
# injector holds its frame, so every word is right and comes a clock late: the clocks' test sees it.
[[bench.mutant]]
name = "joint-two-valid-late"
file = "rtl/seam/seam.sv"
edits = [["logic [W-1:0] inj_frame;", "logic [W-1:0] inj_frame;\n    logic late_valid;\n    always_ff @(posedge clk) late_valid <= inj_valid;"], [".in_valid(inj_valid),", ".in_valid(late_valid),"]]
must_fail = ["the_chains_clocks"]
kind = "WORD"

# Truth read by the core's side: the top reads the truth records' indexes off the bus as they are
# written and puts one bit made of them into the lowest bit of the core's frame.
[[bench.mutant]]
name = "truth-on-the-cores-side"
file = "rtl/seam/seam.sv"
edits = [["logic [W-1:0] inj_frame;", "logic [W-1:0] inj_frame;\n    logic leak;\n    always_ff @(posedge clk) begin\n        if (rst) leak <= 1'b0;\n        else if (reg_valid && reg_we && reg_addr == REG_INJ_TRUTH_INDEX_OFFSET) leak <= leak ^ reg_wdata[0];\n    end"], [".in_frame(inj_frame),", ".in_frame(inj_frame ^ {{(W-1){1'b0}}, leak}),"]]
must_fail = ["truth_isolation"]
kind = "WORD"

# A truth record's ratio as written, not its value, reaching the samples: the delta from the numerator alone.
[[bench.mutant]]
name = "ratio-as-written"
file = "rtl/inject/inject.sv"
edits = [["s2_den <= active ? head_den : DEN_ONE;", "s2_den <= DEN_ONE;"]]
must_fail = ["truth_isolation"]
kind = "WORD"

# A swap that does not happen: the commit's upper word never reaches the core.
# Written as an assign with every comparison in its own brackets, and not as an expression in the
# port's own brackets: docs/rtl/seam.md, section 5, says what the other way did under Icarus.
[[bench.mutant]]
name = "swap-does-not-happen"
file = "rtl/seam/seam.sv"
edits = [["logic [W-1:0] inj_frame;", "logic [W-1:0] inj_frame;\n    logic core_valid;\n    assign core_valid = reg_valid && !(reg_we && (reg_addr == (REG_COMMIT_AT_OFFSET + 4)));"], [".out_record(out_record),\n        .reg_valid(reg_valid),", ".out_record(out_record),\n        .reg_valid(core_valid),"]]
must_fail = ["bit_identity_swap"]
kind = "WORD"

# The source's reg_rdata left off the bus.
[[bench.mutant]]
name = "source-off-the-bus"
file = "rtl/seam/seam.sv"
edits = [["assign reg_rdata = src_rdata | inj_rdata | core_rdata;", "assign reg_rdata = inj_rdata | core_rdata;"]]
must_fail = ["one_bus_three_blocks"]
kind = "WORD"

# A wire that loses one high bit: at the core's input, the bit below the sign of the first channel's
# sample carries the sign. Every sample that fits one bit fewer is right; only a pulse near the top
# of the range is not, which only the long stream has.
[[bench.mutant]]
name = "a-high-bit-lost-at-joint-two"
file = "rtl/seam/seam.sv"
edits = [[".in_frame(inj_frame),", ".in_frame({inj_frame[W-1:SAMPLE_BITS-1], inj_frame[SAMPLE_BITS-1], inj_frame[SAMPLE_BITS-3:0]}),"]]
must_fail = ["bit_identity_chain"]
kind = "WORD"

# The learner's hand-over one frame late: the commit's index reaches the core one higher.
[[bench.mutant]]
name = "hand-over-a-frame-late"
file = "rtl/seam/seam.sv"
edits = [["logic [W-1:0] inj_frame;", "logic [W-1:0] inj_frame;\n    logic [BUS_WORD_BITS-1:0] core_wdata;\n    assign core_wdata = (reg_we && (reg_addr == REG_COMMIT_AT_OFFSET)) ? (reg_wdata + 32'd1) : reg_wdata;"], [".reg_wdata(reg_wdata),\n        .reg_rdata(core_rdata)", ".reg_wdata(core_wdata),\n        .reg_rdata(core_rdata)"]]
must_fail = ["bit_identity_hand_over"]
kind = "WORD"

[[bench]]
name = "seam-s24x3"
toplevel = "seam"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv", "rtl/inject/inject.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/seam/seam_core.sv", "rtl/seam/seam.sv"]
module = "bench_seam"
profiles = ["s24x3"]
identity = ["bit_identity_first_frames", "bit_identity_chain", "truth_isolation", "bit_identity_swap", "bit_identity_hand_over"]

# A frame late between the injector and the core: the data a clock after its valid.
[[bench.mutant]]
name = "joint-two-data-late"
file = "rtl/seam/seam.sv"
edits = [["logic [W-1:0] inj_frame;", "logic [W-1:0] inj_frame;\n    logic [W-1:0] late_frame;\n    always_ff @(posedge clk) late_frame <= inj_frame;"], [".in_frame(inj_frame),", ".in_frame(late_frame),"]]
must_fail = ["bit_identity_first_frames"]
kind = "WORD"

# The other way round between the source and the injector: the valid a clock after its data.
[[bench.mutant]]
name = "joint-one-valid-late"
file = "rtl/seam/seam.sv"
edits = [["logic [W-1:0] inj_frame;", "logic [W-1:0] inj_frame;\n    logic late_valid;\n    always_ff @(posedge clk) late_valid <= src_valid;"], [".in_valid(src_valid),", ".in_valid(late_valid),"]]
must_fail = ["the_chains_clocks"]
kind = "WORD"

# One block's reg_rdata left off the bus: the injector's, whose refusal register would then read
# "no refusal" whatever it held.
[[bench.mutant]]
name = "inject-off-the-bus"
file = "rtl/seam/seam.sv"
edits = [["assign reg_rdata = src_rdata | inj_rdata | core_rdata;", "assign reg_rdata = src_rdata | core_rdata;"]]
must_fail = ["one_bus_three_blocks"]
kind = "WORD"

# A swap a frame late: the commit's index reaches the core one higher.
[[bench.mutant]]
name = "swap-a-frame-late"
file = "rtl/seam/seam.sv"
edits = [["logic [W-1:0] inj_frame;", "logic [W-1:0] inj_frame;\n    logic [BUS_WORD_BITS-1:0] core_wdata;\n    assign core_wdata = (reg_we && (reg_addr == REG_COMMIT_AT_OFFSET)) ? (reg_wdata + 32'd1) : reg_wdata;"], [".reg_wdata(reg_wdata),\n        .reg_rdata(core_rdata)", ".reg_wdata(core_wdata),\n        .reg_rdata(core_rdata)"]]
must_fail = ["bit_identity_swap"]
kind = "WORD"

# A swap to the weights the core already has: once the core has been started, the shadow's stream
# never reaches it; the commit does. The epoch is then right at every record, and only the scores
# say the weights are not the new ones.
[[bench.mutant]]
name = "shadow-never-written"
file = "rtl/seam/seam.sv"
edits = [["logic [W-1:0] inj_frame;", "logic [W-1:0] inj_frame;\n    logic started;\n    logic core_valid;\n    always_ff @(posedge clk) begin\n        if (rst) started <= 1'b0;\n        else if (reg_valid && reg_we && (reg_addr == REG_START_OFFSET)) started <= 1'b1;\n    end\n    assign core_valid = reg_valid && !(started && reg_we && ((reg_addr == REG_SHADOW_BEGIN_OFFSET) || (reg_addr == REG_SHADOW_DATA_OFFSET)));"], [".out_record(out_record),\n        .reg_valid(reg_valid),", ".out_record(out_record),\n        .reg_valid(core_valid),"]]
must_fail = ["bit_identity_swap"]
kind = "WORD"

# The core's reg_rdata left off the bus.
[[bench.mutant]]
name = "core-off-the-bus"
file = "rtl/seam/seam.sv"
edits = [["assign reg_rdata = src_rdata | inj_rdata | core_rdata;", "assign reg_rdata = src_rdata | inj_rdata;"]]
must_fail = ["one_bus_three_blocks"]
kind = "WORD"

# ---------------------------------------------------------------------------------------------
# Parcel FLAG (round 3): the detector core's overflow flag over all its sources and both directions.
# docs/rtl/flag.md says what each test enumerates and what each mutant's evidence was. Two tops, each
# under both profiles: core_small (three hidden units) and rtl/flag/core_twelve.sv (twelve). Every
# mutant runs under one profile and edits rtl/core/ in a copy, so a change to those files refuses it
# by name, MUTANT-DOES-NOT-APPLY.

[[bench]]
name = "flag-s16x1"
toplevel = "core_small"
sources = ["spec/undertone_pkg.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/core/core_small.sv"]
module = "bench_flag"
profiles = ["s16x1"]
identity = ["flag_vclose_both_sources_at_once", "flag_vclose_overflow_upward", "flag_every_state", "flag_one_route", "flag_stays", "flag_far"]
limit = 50

# An overflow flag that is not sticky: each record carries only its own frame's bit (an earlier mutant).
[[bench.mutant]]
name = "overflow-not-sticky"
file = "rtl/core/core.sv"
edits = [["sticky     <= sticky | head_overflow;", "sticky     <= 1'b0;"]]
must_fail = ["flag_stays"]
kind = "WORD"

# The mirror of the closing verifier's fault: a hidden value's fit tested on the high side only.
[[bench.mutant]]
name = "overflow-only-above"
file = "rtl/core/core_head.sv"
edits = [["if (!((&us[W_HEADX-1:W_HID-1]) || !(|us[W_HEADX-1:W_HID-1]))) ovf = 1'b1;", "if (!us[W_HEADX-1] && (|us[W_HEADX-1:W_HID-1])) ovf = 1'b1;"]]
must_fail = ["flag_every_state"]
kind = "WORD"

[[bench]]
name = "flag-s24x3"
toplevel = "core_small"
sources = ["spec/undertone_pkg.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/core/core_small.sv"]
module = "bench_flag"
profiles = ["s24x3"]
identity = ["flag_vclose_both_sources_at_once", "flag_vclose_overflow_upward", "flag_every_state", "flag_one_route", "flag_stays", "flag_far"]
limit = 30

# The closing verifier's first fault (L21): the flag as the exclusive-or of its two sources.
[[bench.mutant]]
name = "sources-are-a-parity"
file = "rtl/core/core_head.sv"
edits = [["out_overflow <= h3_ovf || !(", "out_overflow <= h3_ovf ^ !("]]
must_fail = ["flag_vclose_both_sources_at_once", "flag_every_state"]
kind = "WORD"

# The closing verifier's second fault (L21): a hidden value's fit tested on the low side only.
[[bench.mutant]]
name = "overflow-only-below"
file = "rtl/core/core_head.sv"
edits = [["if (!((&us[W_HEADX-1:W_HID-1]) || !(|us[W_HEADX-1:W_HID-1]))) ovf = 1'b1;", "if (us[W_HEADX-1] && !(&us[W_HEADX-1:W_HID-1])) ovf = 1'b1;"]]
must_fail = ["flag_vclose_overflow_upward", "flag_every_state"]
kind = "WORD"

# An earlier mutant: the flag as the parity of the units that do not fit.
[[bench.mutant]]
name = "overflow-is-a-parity"
file = "rtl/core/core_head.sv"
edits = [["ovf = 1'b1;", "ovf = !ovf;"]]
must_fail = ["flag_every_state"]
kind = "WORD"

# The score's fit tested on the low side only: the second source's own direction.
[[bench.mutant]]
name = "score-fit-only-below"
file = "rtl/core/core_head.sv"
edits = [["out_overflow <= h3_ovf || !((&ash[W_OUTX-1:W_HID-1]) || !(|ash[W_OUTX-1:W_HID-1]));", "out_overflow <= h3_ovf || (ash[W_OUTX-1] && !(&ash[W_OUTX-1:W_HID-1]));"]]
must_fail = ["flag_every_state"]
kind = "WORD"

# Its mirror: the score's fit tested on the high side only.
[[bench.mutant]]
name = "score-fit-only-above"
file = "rtl/core/core_head.sv"
edits = [["out_overflow <= h3_ovf || !((&ash[W_OUTX-1:W_HID-1]) || !(|ash[W_OUTX-1:W_HID-1]));", "out_overflow <= h3_ovf || (!ash[W_OUTX-1] && (|ash[W_OUTX-1:W_HID-1]));"]]
must_fail = ["flag_every_state"]
kind = "WORD"

# A hidden value's fit tested by two bits only, the extended value's top bit against the field's sign
# bit. Right for every first excursion within the field's width of its edge; wrong past 2^64, which
# on this top only a swap reaches.
[[bench.mutant]]
name = "fit-by-two-bits"
file = "rtl/core/core_head.sv"
edits = [["if (!((&us[W_HEADX-1:W_HID-1]) || !(|us[W_HEADX-1:W_HID-1]))) ovf = 1'b1;", "if (us[W_HEADX-1] != us[W_HID-1]) ovf = 1'b1;"]]
must_fail = ["flag_far"]
kind = "WORD"

[[bench]]
name = "flag-twelve-s16x1"
toplevel = "core_twelve"
sources = ["spec/undertone_pkg.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/flag/core_twelve.sv"]
module = "bench_flag"
profiles = ["s16x1"]
identity = ["flag_vclose_both_sources_at_once", "flag_vclose_overflow_upward", "flag_every_state", "flag_one_route", "flag_stays", "flag_far"]
limit = 40

# The status register's bit `overflow` reading the last frame's own bit, not the sticky flag.
[[bench.mutant]]
name = "status-overflow-not-sticky"
file = "rtl/core/core.sv"
edits = [["st[REG_STATUS_OVERFLOW_BIT]      = sticky;", "st[REG_STATUS_OVERFLOW_BIT]      = head_overflow;"]]
must_fail = ["flag_status_reads_the_flag"]
kind = "WORD"

# The other side of fit-by-two-bits: a hidden value's fit window one bit short at its foot, so a value
# in [2^63, 2^64) passes as fitting. Under this profile the window is then one bit and never fires.
[[bench.mutant]]
name = "fit-window-one-bit-short"
file = "rtl/core/core_head.sv"
edits = [["if (!((&us[W_HEADX-1:W_HID-1]) || !(|us[W_HEADX-1:W_HID-1]))) ovf = 1'b1;", "if (!((&us[W_HEADX-1:W_HID]) || !(|us[W_HEADX-1:W_HID]))) ovf = 1'b1;"]]
must_fail = ["flag_every_state"]
kind = "WORD"

[[bench]]
name = "flag-twelve-s24x3"
toplevel = "core_twelve"
sources = ["spec/undertone_pkg.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/flag/core_twelve.sv"]
module = "bench_flag"
profiles = ["s24x3"]
identity = ["flag_vclose_both_sources_at_once", "flag_vclose_overflow_upward", "flag_every_state", "flag_one_route", "flag_stays", "flag_far"]
limit = 30

# An earlier mutant: only hidden unit 0 can raise the flag.
[[bench.mutant]]
name = "overflow-from-unit-zero-only"
file = "rtl/core/core_head.sv"
edits = [["if (!((&us[W_HEADX-1:W_HID-1])", "if ((j == 0) && !((&us[W_HEADX-1:W_HID-1])"]]
must_fail = ["flag_every_state"]
kind = "WORD"

# An earlier mutant: every hidden unit but the build's last can raise the flag. The last is unit 11 here.
[[bench.mutant]]
name = "overflow-not-from-the-last-unit"
file = "rtl/core/core_head.sv"
edits = [["if (!((&us[W_HEADX-1:W_HID-1])", "if ((j != B_HIDDEN-1) && !((&us[W_HEADX-1:W_HID-1])"]]
must_fail = ["flag_every_state"]
kind = "WORD"

# Only the first three hidden units can raise the flag: right on the small top, wrong at twelve.
[[bench.mutant]]
name = "overflow-from-the-first-three-units-only"
file = "rtl/core/core_head.sv"
edits = [["if (!((&us[W_HEADX-1:W_HID-1])", "if ((j < 3) && !((&us[W_HEADX-1:W_HID-1])"]]
must_fail = ["flag_every_state"]
kind = "WORD"

# ---------------------------------------------------------------------------------------------------
# KRNL (round 3): the kernel, rtl/krnl/undertone_krnl.sv, driven only through its AXI4-Lite port and its
# memory; docs/rtl/krnl.md. Three tops: the packaged one at the first build's maxima, the same at the
# definition's maxima, and the same at small maxima with a queue of 8 (two rows, one a profile, so that
# each of its mutants runs under one). Each mutant is read by its evidence against the record and field
# docs/rtl/krnl.md's table predicts, not by its verdict alone.

[[bench]]
name = "krnl-first"
toplevel = "undertone_krnl"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv", "rtl/inject/inject.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/krnl/undertone_krnl.sv"]
module = "bench_krnl"
profiles = ["s16x1", "s24x3"]
identity = ["identity_e0", "identity_long_bursts", "identity_hidden", "identity_on_axi_ram"]
limit = 80

# Faults of long bursts, which only a queue of more than 8 records shows (VKRNL's four, round 3). The next
# burst's address one slot on after a burst of 16; after any burst of more than 8; WLAST a beat early in a
# burst of 16; bursts of up to 20.
[[bench.mutant]]
name = "a-slot-skipped-after-a-burst-of-16"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["issued <= issued + len;", "issued <= issued + len + (len == 8'd16);"]]
must_fail = ["identity_long_bursts"]
kind = "WORD"

[[bench.mutant]]
name = "a-slot-skipped-after-a-burst-over-8"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["issued <= issued + len;", "issued <= issued + len + (len > 8'd8);"]]
must_fail = ["identity_long_bursts"]
kind = "WORD"

[[bench.mutant]]
name = "wlast-early-in-a-burst-of-16"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["assign m_axi_gmem_wlast   = (beats_left == 5'd1);", "assign m_axi_gmem_wlast   = (beats_left == 5'd1) || (m_axi_gmem_awlen == 8'd15 && beats_left == 5'd2);"]]
must_fail = ["identity_long_bursts"]
kind = ""

[[bench.mutant]]
name = "bursts-of-20"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["localparam int BURST      = 16;", "localparam int BURST      = 20;"]]
must_fail = ["identity_long_bursts"]
kind = ""

# The capability-bits gate's control, held without a second build: a core that advertises one tap more
# than it takes. RTL-B's file, edited here as text inside the mutant only.
[[bench.mutant]]
name = "advertises-a-longer-filter"
file = "rtl/core/core.sv"
edits = [["reg_rdata <= B_TAPS;", "reg_rdata <= B_TAPS + 1;"]]
must_fail = ["capabilities_are_accepted"]
kind = ""

# The gate's other half: a core that takes a shape one tap past what it advertises. RTL-B's file, edited
# here as text inside the mutant only.
[[bench.mutant]]
name = "takes-one-tap-past-its-advertisement"
file = "rtl/core/core.sv"
edits = [["(shp_taps > B_TAPS)", "(shp_taps > B_TAPS + 1)"]]
must_fail = ["capabilities_are_accepted"]
kind = ""

[[bench]]
name = "krnl-max"
toplevel = "krnl_max"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv", "rtl/inject/inject.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/krnl/undertone_krnl.sv", "rtl/krnl/krnl_max.sv"]
module = "bench_krnl_max"
profiles = ["s16x1", "s24x3"]
identity = ["identity_e0"]
limit = 40

[[bench]]
name = "krnl-small-s16x1"
toplevel = "krnl_small"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv", "rtl/inject/inject.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/krnl/undertone_krnl.sv", "rtl/krnl/krnl_small.sv"]
module = "bench_krnl_small"
profiles = ["s16x1"]
identity = ["identity_small", "identity_w_before_aw", "truth_isolation", "truth_while_running", "reset_between_runs"]
limit = 110

# A record writer that drops one record: record 5 counted and not queued.
[[bench.mutant]]
name = "drops-one-record"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["push = 1'b1;", "push = (rec_in != 64'd5);"]]
must_fail = ["identity_small"]
kind = "WORD"

# A record writer that steps its address wrongly: each burst's next address advances one slot short.
[[bench.mutant]]
name = "address-steps-wrong"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["issued <= issued + len;", "issued <= issued + len - 1'b1;"]]
must_fail = ["identity_small"]
kind = "WORD"

# A done raised before the last write is answered: the run's end waits for no answer.
[[bench.mutant]]
name = "done-before-answer"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["wr == WR_IDLE && outs == '0", "wr == WR_IDLE"], ["&& !m_axi_gmem_bvalid && (unissued", "&& (unissued"]]
must_fail = ["identity_small"]
kind = ""

# A queue that overflows without the refusal: the record is dropped and nothing is latched.
[[bench.mutant]]
name = "queue-overflows-silently"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["r_code = C_QUEUE;", "r_code = '0;"]]
must_fail = ["queue_overflow_refused"]
kind = ""

# An answer other than OKAY not read.
[[bench.mutant]]
name = "error-answer-ignored"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["if (outs == '0 || m_axi_gmem_bresp != 2'b00) begin", "if (outs == '0) begin"]]
must_fail = ["memory_error_refused"]
kind = ""

# A kernel that routes a truth row to the core: the lowest bit of the last numerator written to the
# injector, put into the lowest bit of every frame the core takes.
[[bench.mutant]]
name = "truth-reaches-the-core"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["assign core_frame = inj_frame;", "logic snoop = 1'b0; always @(posedge ap_clk) if (bus_valid && bus_we && bus_addr == REG_INJ_TRUTH_AMPLITUDE_NUM_OFFSET) snoop <= bus_wdata[0]; assign core_frame = inj_frame ^ {{(W-1){1'b0}}, snoop};"]]
must_fail = ["truth_isolation"]
kind = ""

# A writer that waits for AWREADY before raising WVALID, against a memory whose AWREADY waits for WVALID:
# never answered, so the test's bounded wait for done fails by name (VKRNL's finding, round 3).
[[bench.mutant]]
name = "w-waits-for-the-address"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["wire             w_gate = 1'b1;", "wire             w_gate = aw_done;"]]
must_fail = ["identity_w_before_aw"]
kind = ""

# The edge, at the places VKRNL found untried (round 3): the buffer's lower word taken while a run goes; the
# base's alignment checked on bits 4 to 1 only; bursts issued after an answer of SLVERR.
[[bench.mutant]]
name = "buffer-taken-while-running"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["REG_KRN_BUFFER_OFFSET:          if (running) f_code = C_BUSY; else k_buffer[31:0]  <= w_q;", "REG_KRN_BUFFER_OFFSET:          k_buffer[31:0]  <= w_q;"]]
must_fail = ["refused_at_the_edge"]
kind = ""

[[bench.mutant]]
name = "alignment-checked-above-bit-0"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["k_buffer[SLOT_SHIFT-1:0] != '0", "k_buffer[SLOT_SHIFT-1:1] != '0"]]
must_fail = ["refused_at_the_edge"]
kind = ""

[[bench.mutant]]
name = "bursts-after-an-error"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["if (running && !mem_err && unissued != '0 && outs < OUTS) begin", "if (running && unissued != '0 && outs < OUTS) begin"]]
must_fail = ["memory_error_refused"]
kind = ""

[[bench]]
name = "krnl-small-s24x3"
toplevel = "krnl_small"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv", "rtl/inject/inject.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/krnl/undertone_krnl.sv", "rtl/krnl/krnl_small.sv"]
module = "bench_krnl_small"
profiles = ["s24x3"]
identity = ["identity_small", "identity_w_before_aw", "truth_isolation", "truth_while_running", "reset_between_runs"]
limit = 120

# A record writer that writes one twice: record 5's beat sent, and sent again as the next.
[[bench.mutant]]
name = "writes-one-twice"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["if (pop) rp <= rp + 1'b1;", "if (pop && !(rp == 5 && answered < 8)) rp <= rp + 1'b1;"]]
must_fail = ["identity_small"]
kind = "WORD"

# A queue that advertises twice its depth.
[[bench.mutant]]
name = "advertises-a-deeper-queue"
file = "rtl/krnl/undertone_krnl.sv"
edits = [["own_word = RECORD_QUEUE;", "own_word = 2 * RECORD_QUEUE;"]]
must_fail = ["queue_overflow_refused"]
kind = ""

# ---------------------------------------------------------------------------------------------
# HOST (round 3): the host library (host/) driving the kernel, KRNL's packaged top at the first build's
# maxima, through its coroutine driver over rtl/tb/host_sim.py; docs/host/host.md. Bit identity's second
# part, the host, in simulation: every word the library hands its caller is the model's. One row, both
# profiles, no RTL mutant: the faults this bench must see are the library's and the backend's, planted as
# subclasses and wrappers in its control_* tests, each read against the record and field it predicts.
# The limit is about three times the longer run of the row alone (25 s, docs/host/host.md, row H3).

[[bench]]
name = "host-first"
toplevel = "undertone_krnl"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv", "rtl/inject/inject.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/krnl/undertone_krnl.sv"]
module = "bench_host"
profiles = ["s16x1", "s24x3"]
identity = ["identity_e0", "identity_fed_and_swapped", "refusal_read_back_by_name"]
limit = 80

# ---------------------------------------------------------------------- RTL-L (round 5): the learner
# The learner of phase B beside the detector core (rtl/learn/, docs/rtl/learn.md), held to
# model/learner.py. Two tops: learn_small, a small core and the learner, frames and truth from the bench;
# and learn_chain, the seam's chain with the learner at the definition's bounds, truth from the injector.
# Every mutant runs under one profile; its evidence is read against the record or the register its fault
# predicts (docs/rtl/learn.md, section 8's table).

[[bench]]
name = "learn-s16x1"
toplevel = "learn_small"
sources = ["spec/undertone_pkg.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/learn/learn.sv", "rtl/learn/learn_port.sv", "rtl/learn/learn_small.sv"]
module = "bench_learn"
profiles = ["s16x1"]
identity = ["bit_identity_hand_worked_ties", "bit_identity_every_coefficient", "update_finishes_within_f", "skips_at_their_boundaries", "snapshot_at_u", "a_record_offered_late", "frames_every_clock", "refuses_an_update", "refuses_the_core_rows", "refuses_swap_shape", "refuses_what_the_model_cannot", "quantise_input", "refusal_order", "rows_read_back", "reads_while_the_learner_writes", "extremes_by_real_windows"]
limit = 120

# A learner that does nothing: no window is ever taken.
[[bench.mutant]]
name = "does-nothing"
file = "rtl/learn/learn.sv"
edits = [["take0 = fire0 && !o0_start && !o0_busy && !o0_full;", "take0 = 1'b0;"], ["take1 = fire1 && !o1_busy && !o1_full;", "take1 = 1'b0;"]]
must_fail = ["bit_identity_hand_worked_ties"]
kind = "WORD"

# The rounding the other way: a tie goes away from zero.

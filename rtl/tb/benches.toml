[[bench]]
name = "learn-chain-s16x1"
toplevel = "learn_chain"
sources = ["spec/undertone_pkg.sv", "rtl/source/source_mulc.sv", "rtl/source/source.sv", "rtl/inject/inject.sv", "rtl/core/core_head.sv", "rtl/core/core.sv", "rtl/learn/learn.sv", "rtl/learn/learn_port.sv", "rtl/learn/learn_chain.sv"]
module = "bench_learn_chain"
profiles = ["s16x1"]
identity = ["update_finishes_within_f", "truth_isolation", "bit_identity_e1_flow"]
limit = 240

# A commit at an index no one named: the commit's lower word reaches the core one higher.
[[bench.mutant]]
name = "commit-a-frame-late"
file = "rtl/learn/learn_port.sv"
edits = [["assign c_wdata   = host ? reg_wdata : lw_wdata;", "assign c_wdata   = host ? reg_wdata + ((reg_addr == REG_COMMIT_AT_OFFSET) ? 1 : 0) : lw_wdata;"]]
must_fail = ["bit_identity_e1_flow"]
kind = "WORD"

# A commit the learner makes itself, two frames after its last write.
[[bench.mutant]]
name = "learner-commits-itself"
file = "rtl/learn/learn.sv"
edits = [["""                    if (!lw_valid) begin                    // the last write has been taken
                        done_n = 1'b1;""", """                    if (!lw_valid && lw_addr == REG_SHADOW_DATA_OFFSET) begin
                        lw_valid <= 1'b1; lw_addr <= REG_COMMIT_AT_OFFSET; lw_wdata <= core_next_index[31:0] + 2;
                    end else if (!lw_valid && lw_addr == REG_COMMIT_AT_OFFSET) begin
                        lw_valid <= 1'b1; lw_addr <= REG_COMMIT_AT_OFFSET + WBYTES; lw_wdata <= core_next_index[63:32];
                    end else if (!lw_valid) begin
                        done_n = 1'b1;"""]]
must_fail = ["truth_isolation"]
kind = "WORD"

# Truth reaching a score with no commit: the lowest bit of the last truth index taken, into the core's frame.
[[bench.mutant]]
name = "truth-into-the-frame"
file = "rtl/learn/learn_chain.sv"
edits = [["    assign core_frame = inj_frame;", "    logic t_odd = 1'b0; always @(posedge clk) if (t_push) t_odd <= t_index[0]; assign core_frame = inj_frame ^ {{(W-1){1'b0}}, t_odd};"]]
must_fail = ["truth_isolation"]
kind = "WORD"

# A learner that reads the amplitude: a record whose numerator is odd is not handed over.
[[bench.mutant]]
name = "reads-the-amplitude"
file = "rtl/learn/learn_chain.sv"
edits = [["wire                        t_push = u_inject.wr_push;", "wire                        t_push = u_inject.wr_push && !u_inject.t_num[0];"]]
must_fail = ["truth_isolation"]
kind = "WORD"

# The learner's word off the bus.
[[bench.mutant]]
name = "learner-off-the-bus"
file = "rtl/learn/learn_chain.sv"
edits = [["assign reg_rdata = src_rdata | inj_rdata | core_rdata | learn_rdata;", "assign reg_rdata = src_rdata | inj_rdata | core_rdata;"]]
must_fail = ["one_bus_four_blocks"]
kind = "WORD"


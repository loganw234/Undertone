# THE REFUSALS' TWO CONTROLS, each held against all nineteen tests, one test a name. Under this
# profile, because only here does a shape reach SHAPE_ROWS.
# A core that refuses nothing: the chain's result is forced to none, so every refused write is taken,
# and a frame offered to a core that is not running is dropped with nothing latched.
[[bench.mutant]]
name = "refuses-nothing"
file = "rtl/core/core.sv"
edits = [
    ["if (x_register_access) wcode = REFUSAL_REGISTER_ACCESS;", "if (x_register_access) wcode = REFUSAL_REGISTER_ACCESS;\n            wcode = 8'd0;"],
    ["if (in_valid && !running) fcode = REFUSAL_CORE_STOPPED;", "if (1'b0) fcode = REFUSAL_CORE_STOPPED;"],
]
must_fail = ["refuses_profile_unknown", "refuses_shape_filters", "refuses_shape_taps", "refuses_shape_rectifier", "refuses_shape_shift", "refuses_shape_pool", "refuses_shape_hidden", "refuses_shape_hidden_shift", "refuses_shape_between", "refuses_shape_channel", "refuses_shape_rows", "refuses_weight_count", "refuses_weight_range", "refuses_swap_shape", "refuses_swap_pending", "refuses_swap_index", "refuses_swap_epoch", "refuses_core_stopped", "refuses_register_access"]
kind = "WORD"

# A core that names every refusal wrongly: the number it reports is changed for all of them, where
# `refusal` is read. (Changed where it is latched, the latch reads itself back and the fault undoes
# itself every other clock: the first form of this mutant did that, and all nineteen tests passed it.)
[[bench.mutant]]
name = "names-every-refusal-wrongly"
file = "rtl/core/core.sv"
edits = [["reg_rdata <= refusal;", "reg_rdata <= (refusal == 8'd0) ? 32'd0 : (refusal ^ 32'd64);"]]
must_fail = ["refuses_profile_unknown", "refuses_shape_filters", "refuses_shape_taps", "refuses_shape_rectifier", "refuses_shape_shift", "refuses_shape_pool", "refuses_shape_hidden", "refuses_shape_hidden_shift", "refuses_shape_between", "refuses_shape_channel", "refuses_shape_rows", "refuses_weight_count", "refuses_weight_range", "refuses_swap_shape", "refuses_swap_pending", "refuses_swap_index", "refuses_swap_epoch", "refuses_core_stopped", "refuses_register_access"]
kind = "WORD"


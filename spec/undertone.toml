# The one definition.
#
# Every other place that states one of these facts is generated from this file
# (tools/gen_spec.py writes spec/constants.py) or reads that generated copy.
# To change a fact: edit here, run `python tools/gen_spec.py`, commit both.
# The `generated` stage of verify/run.sh fails when the two disagree.
#
# This file is the lead's. A parcel that needs a change asks for it.

[meta]
spec_version = 1

# A profile is a complete sample format. Row D1 of the design D0 (16-bit, one
# channel) is NOT fixed in round 1, so nothing may assume one profile: code
# takes a profile by name, and tests run under at least two.
# A profile's name says what it is: sample bits, then channels. The first is
# D0 row D1 as proposed. The second is a guess at a seismic record, there so
# that nothing is hard-wired to the first.
[profile.s16x1]
sample_bits = 16
channels = 1

[profile.s24x3]
sample_bits = 24
channels = 3

# D0 row D3 proposes "a first bank" of 16 filters of 128 taps. Taking those
# two figures as the maxima a shape may have is the lead's reading.
#
# The other three bounds here, and the scorer's one further down, are the
# lead's DECISIONS of 2026-11-23, taken from parcel MOD-B's design: they are
# the values its width argument is worked at, and D0 states none of them.
#   A row is one channel's coefficients for one filter. A shape's rows, summed
#   over its filters, are bounded apart from its filters: the two counts are
#   two facts that share a value today.
#   The pool is a moving sum over this many rectified values at most.
#   The score shift is how far the head's sum is shifted right into a score.
[core]
coeff_bits = 18     # D0 row D2
max_filters = 16    # D0 row D3
max_taps = 128      # D0 row D3
max_rows = 16
max_pool = 65536
max_score_shift = 31
# The head's hidden layer (parcel HEAD's design, round 2). Both are the lead's
# DECISIONS of 2026-11-23, and D0 states neither.
#   The most hidden units a shape may have. Twelve is the most that keeps the
#   whole head, counted as multipliers at these maxima, within a tenth of the
#   filter bank: (max_filters + 1) * 12 = 204 against 16 * 128 / 10 = 204.8.
#   How far a hidden unit's sum may be shifted right into its value.
max_hidden = 12
max_hidden_shift = 31

# The rectifier's modes, each by the code a weight blob carries for it. A code
# fits one byte.
[rectifier]
pass = 0    # the filter's sum goes on unchanged
abs = 1     # its magnitude goes on

# The most bins a scorer's histogram of scores may have.
[scorer]
max_hist_bins = 4096

# How a real coefficient set becomes an integer one. This is the rule only:
# model/ and stats/ each implement it, and share no code.
#   scale    = "peak_to_max": multiply the set so its largest magnitude maps
#              to 2^(coeff_bits - 1) - 1
#   rounding = "half_to_even"
[quantise]
scale = "peak_to_max"
rounding = "half_to_even"

# How an injected sample becomes an integer. The injector adds
# pulse[j] * amplitude_num / amplitude_den to the stream, and that quotient is
# rounded by this rule. Anything that rebuilds an injected stream uses it.
[inject]
rounding = "half_to_even"

# Record formats: [name, bits, "signed" | "unsigned"], in order.
# The score field is wide on purpose. MOD-B's width argument may narrow it.
[records]
score = [["index", 64, "unsigned"], ["epoch", 32, "unsigned"], ["flags", 8, "unsigned"], ["score", 64, "signed"]]
truth = [["index", 64, "unsigned"], ["pulse_id", 16, "unsigned"], ["amplitude_num", 32, "signed"], ["amplitude_den", 32, "unsigned"]]
event = [["index", 64, "unsigned"], ["epoch", 32, "unsigned"], ["score", 64, "signed"], ["pre", 16, "unsigned"], ["post", 16, "unsigned"]]

# Bit positions in a score record's flags field. Every other bit is reserved
# and must be zero. There is no bit for "an injection is here": truth goes
# around the detector, never through its records.
[flags]
settling = 0    # this output mixes two weight epochs
overflow = 1    # sticky: an accumulator overflowed

# The only names a refusal may carry.
[refusals]
names = [
    "PROFILE_UNKNOWN",
    "CHANNELS",
    "SAMPLE_RANGE",
    "SHAPE_FILTERS",
    "SHAPE_TAPS",
    "RESERVED_BITS",
    "BLOB_HASH",
    "SWAP_PENDING",
    "RECORD_KIND",
    "RECORD_FIELD",
    # The detector core, its weight store and its scorer (parcel MOD-B).
    "SHAPE_CHANNEL",
    "SHAPE_ROWS",
    "SHAPE_RECTIFIER",
    "SHAPE_POOL",
    "SHAPE_SHIFT",
    "WEIGHT_COUNT",
    "WEIGHT_RANGE",
    "BLOB_FORMAT",
    "SWAP_SHAPE",
    "SWAP_INDEX",
    "SWAP_EPOCH",
    "SCORER_THRESHOLD",
    "SCORER_WINDOW",
    "SCORER_BINS",
    "RECORD_ORDER",
    "QUANTISE_INPUT",
    # The source, the injector and the replay file (parcel MOD-A).
    "SEED_RANGE",
    "NOISE_SIGMA",
    "NOISE_RANGE",
    "STREAM_LENGTH",
    "PULSE_UNKNOWN",
    "INJECT_OVERLAP",
    "INJECT_PAST_END",
    "INJECT_RANGE",
    "REPLAY_FORMAT",
    "REPLAY_PROFILE",
    "REPLAY_HASH",
    # The head's hidden layer (parcel HEAD, round 2).
    "SHAPE_HIDDEN",
    "SHAPE_HIDDEN_SHIFT",
    "SHAPE_BETWEEN",
]

# Reference pulses, as integer data, by path under spec/.
[pulses]
e0 = "pulses/e0.toml"

# The number a truth record's pulse_id field carries for each pulse. Declared,
# never "position in sorted order": adding a pulse must not renumber the rest.
# Every pulse has one, and no two share one.
[pulse_ids]
e0 = 0

# The number the fabric reports for a refusal. 0 means "none" and is no name's.
# Declared, never "position in the list": adding a name must not renumber the
# rest. Every name above has one, no two share one, and each fits a byte.
# Which refusals the fabric raises, and which the host library raises before
# anything reaches the fabric, is the design of the RTL, not of this table.
[refusal_codes]
PROFILE_UNKNOWN = 1
CHANNELS = 2
SAMPLE_RANGE = 3
SHAPE_FILTERS = 4
SHAPE_TAPS = 5
RESERVED_BITS = 6
BLOB_HASH = 7
SWAP_PENDING = 8
RECORD_KIND = 9
RECORD_FIELD = 10
SHAPE_CHANNEL = 11
SHAPE_ROWS = 12
SHAPE_RECTIFIER = 13
SHAPE_POOL = 14
SHAPE_SHIFT = 15
WEIGHT_COUNT = 16
WEIGHT_RANGE = 17
BLOB_FORMAT = 18
SWAP_SHAPE = 19
SWAP_INDEX = 20
SWAP_EPOCH = 21
SCORER_THRESHOLD = 22
SCORER_WINDOW = 23
SCORER_BINS = 24
RECORD_ORDER = 25
QUANTISE_INPUT = 26
SEED_RANGE = 27
NOISE_SIGMA = 28
NOISE_RANGE = 29
STREAM_LENGTH = 30
PULSE_UNKNOWN = 31
INJECT_OVERLAP = 32
INJECT_PAST_END = 33
INJECT_RANGE = 34
REPLAY_FORMAT = 35
REPLAY_PROFILE = 36
REPLAY_HASH = 37
SHAPE_HIDDEN = 38
SHAPE_HIDDEN_SHIFT = 39
SHAPE_BETWEEN = 40

# The register map's frame: what the host reads and writes, and how.
#   A register is one word of word_bits at a byte offset that is a multiple of
#   the word's bytes, under address_bits of address. No register sits below
#   first_offset: those words are the kernel's own control (the sibling project's
#   kernel keeps the same frame on this card). A value wider than a word takes
#   consecutive words, its lowest bits at the lowest offset.
#   magic is what the register `id` reads: "UNDT" as ASCII.
[bus]
word_bits = 32
address_bits = 12
first_offset = 0x10
magic = 0x554E4454

# The registers: name = [byte offset, "ro" | "rw" | "wo", words].
#
# Today this is the identity and capability block only, all read-only. It is
# what a build says of itself: the definition it was generated from, and each
# bound it was synthesised at. A capability register holds the build's value
# of the bound it is named for; cap_rectifiers has bit c set when the build
# accepts rectifier code c, and cap_blob_versions bit v when it accepts blob
# version v.
#
# The control block (the shape, the shadow weights, the commit, the status, the
# latched refusal) is NOT here yet. It is drawn at the design stop of the
# detector core's RTL, from offset 0x80 up, and entered by the lead.
[registers]
id = [0x10, "ro", 1]
spec_version = [0x14, "ro", 1]
spec_hash = [0x18, "ro", 8]
cap_sample_bits = [0x38, "ro", 1]
cap_channels = [0x3C, "ro", 1]
cap_coeff_bits = [0x40, "ro", 1]
cap_filters = [0x44, "ro", 1]
cap_taps = [0x48, "ro", 1]
cap_rows = [0x4C, "ro", 1]
cap_pool = [0x50, "ro", 1]
cap_score_shift = [0x54, "ro", 1]
cap_hidden = [0x58, "ro", 1]
cap_hidden_shift = [0x5C, "ro", 1]
cap_rectifiers = [0x60, "ro", 1]
cap_blob_versions = [0x64, "ro", 1]

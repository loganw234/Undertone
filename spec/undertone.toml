# The one definition.
#
# Every other place that states one of these facts is generated from this file
# (tools/gen_spec.py writes spec/constants.py) or reads that generated copy.
# To change a fact: edit here, run `python tools/gen_spec.py`, commit both.
# The `generated` stage of verify/run.sh fails when the two disagree.
#
# This file is the lead's. A parcel that needs a change asks for it.

[meta]
spec_version = 1

# A profile is a complete sample format. Row D1 of the design D0 (16-bit, one
# channel) is NOT fixed in round 1, so nothing may assume one profile: code
# takes a profile by name, and tests run under at least two.
# A profile's name says what it is: sample bits, then channels. The first is
# D0 row D1 as proposed. The second is a guess at a seismic record, there so
# that nothing is hard-wired to the first.
[profile.s16x1]
sample_bits = 16
channels = 1

[profile.s24x3]
sample_bits = 24
channels = 3

# D0 row D3 proposes "a first bank" of 16 filters of 128 taps. Taking those
# two figures as the maxima a shape may have is the lead's reading.
#
# The other three bounds here, and the scorer's one further down, are the
# lead's DECISIONS of 2026-11-23, taken from parcel MOD-B's design: they are
# the values its width argument is worked at, and D0 states none of them.
#   A row is one channel's coefficients for one filter. A shape's rows, summed
#   over its filters, are bounded apart from its filters: the two counts are
#   two facts that share a value today.
#   The pool is a moving sum over this many rectified values at most.
#   The score shift is how far the head's sum is shifted right into a score.
[core]
coeff_bits = 18     # D0 row D2
max_filters = 16    # D0 row D3
max_taps = 128      # D0 row D3
max_rows = 16
max_pool = 65536
max_score_shift = 31
# The head's hidden layer (parcel HEAD's design, round 2). Both are the lead's
# DECISIONS of 2026-11-23, and D0 states neither.
#   The most hidden units a shape may have. Twelve is the most that keeps the
#   whole head, counted as multipliers at these maxima, within a tenth of the
#   filter bank: (max_filters + 1) * 12 = 204 against 16 * 128 / 10 = 204.8.
#   How far a hidden unit's sum may be shifted right into its value.
max_hidden = 12
max_hidden_shift = 31

# The rectifier's modes, each by the code a weight blob carries for it. A code
# fits one byte.
[rectifier]
pass = 0    # the filter's sum goes on unchanged
abs = 1     # its magnitude goes on

# The most bins a scorer's histogram of scores may have.
[scorer]
max_hist_bins = 4096

# How a real coefficient set becomes an integer one. This is the rule only:
# model/ and stats/ each implement it, and share no code.
#   scale    = "peak_to_max": multiply the set so its largest magnitude maps
#              to 2^(coeff_bits - 1) - 1
#   rounding = "half_to_even"
[quantise]
scale = "peak_to_max"
rounding = "half_to_even"

# How an injected sample becomes an integer. The injector adds
# pulse[j] * amplitude_num / amplitude_den to the stream, and that quotient is
# rounded by this rule. Anything that rebuilds an injected stream uses it.
[inject]
rounding = "half_to_even"

# Record formats: [name, bits, "signed" | "unsigned"], in order.
# The score field is wide on purpose. MOD-B's width argument may narrow it.
[records]
score = [["index", 64, "unsigned"], ["epoch", 32, "unsigned"], ["flags", 8, "unsigned"], ["score", 64, "signed"]]
truth = [["index", 64, "unsigned"], ["pulse_id", 16, "unsigned"], ["amplitude_num", 32, "signed"], ["amplitude_den", 32, "unsigned"]]
event = [["index", 64, "unsigned"], ["epoch", 32, "unsigned"], ["score", 64, "signed"], ["pre", 16, "unsigned"], ["post", 16, "unsigned"]]

# Bit positions in a score record's flags field. Every other bit is reserved
# and must be zero. There is no bit for "an injection is here": truth goes
# around the detector, never through its records.
[flags]
settling = 0    # this output mixes two weight epochs
overflow = 1    # sticky: an accumulator overflowed

# The only names a refusal may carry.
[refusals]
names = [
    "PROFILE_UNKNOWN",
    "CHANNELS",
    "SAMPLE_RANGE",
    "SHAPE_FILTERS",
    "SHAPE_TAPS",
    "RESERVED_BITS",
    "BLOB_HASH",
    "SWAP_PENDING",
    "RECORD_KIND",
    "RECORD_FIELD",
    # The detector core, its weight store and its scorer (parcel MOD-B).
    "SHAPE_CHANNEL",
    "SHAPE_ROWS",
    "SHAPE_RECTIFIER",
    "SHAPE_POOL",
    "SHAPE_SHIFT",
    "WEIGHT_COUNT",
    "WEIGHT_RANGE",
    "BLOB_FORMAT",
    "SWAP_SHAPE",
    "SWAP_INDEX",
    "SWAP_EPOCH",
    "SCORER_THRESHOLD",
    "SCORER_WINDOW",
    "SCORER_BINS",
    "RECORD_ORDER",
    "QUANTISE_INPUT",
    # The source, the injector and the replay file (parcel MOD-A).
    "SEED_RANGE",
    "NOISE_SIGMA",
    "NOISE_RANGE",
    "STREAM_LENGTH",
    "PULSE_UNKNOWN",
    "INJECT_OVERLAP",
    "INJECT_PAST_END",
    "INJECT_RANGE",
    "REPLAY_FORMAT",
    "REPLAY_PROFILE",
    "REPLAY_HASH",
    # The head's hidden layer (parcel HEAD, round 2).
    "SHAPE_HIDDEN",
    "SHAPE_HIDDEN_SHIFT",
    "SHAPE_BETWEEN",
    # The fabric's alone (round 2, parcels RTL-B and RTL-A). The model raises
    # none of these: it has no core that is stopped, no bus, and no bound on a
    # schedule. A frame, a commit or a weight offered to a core that cannot
    # take it; a register write the map does not take; a truth record offered
    # to an injector whose store is full.
    "CORE_STOPPED",
    "REGISTER_ACCESS",
    "INJECT_PENDING",
    # The kernel's alone (round 3, parcel KRNL). The model raises none of
    # these: it has no kernel, no buffer and no memory path. A start while a
    # run goes; a buffer base that is not a slot's multiple; a buffer too small
    # for the run; a source that does not run when started; a record that
    # finds the kernel's queue full; a write the memory answers with an error;
    # a run that ends with another count of records than it was asked for.
    "KERNEL_BUSY",
    "BUFFER_ALIGN",
    "BUFFER_SIZE",
    "RUN_START",
    "RECORD_QUEUE",
    "MEMORY_WRITE",
    "RUN_LENGTH",
]

# Reference pulses, as integer data, by path under spec/.
[pulses]
e0 = "pulses/e0.toml"

# The number a truth record's pulse_id field carries for each pulse. Declared,
# never "position in sorted order": adding a pulse must not renumber the rest.
# Every pulse has one, and no two share one.
[pulse_ids]
e0 = 0

# The number the fabric reports for a refusal. 0 means "none" and is no name's.
# Declared, never "position in the list": adding a name must not renumber the
# rest. Every name above has one, no two share one, and each fits a byte.
# Which refusals the fabric raises, and which the host library raises before
# anything reaches the fabric, is the design of the RTL, not of this table.
[refusal_codes]
PROFILE_UNKNOWN = 1
CHANNELS = 2
SAMPLE_RANGE = 3
SHAPE_FILTERS = 4
SHAPE_TAPS = 5
RESERVED_BITS = 6
BLOB_HASH = 7
SWAP_PENDING = 8
RECORD_KIND = 9
RECORD_FIELD = 10
SHAPE_CHANNEL = 11
SHAPE_ROWS = 12
SHAPE_RECTIFIER = 13
SHAPE_POOL = 14
SHAPE_SHIFT = 15
WEIGHT_COUNT = 16
WEIGHT_RANGE = 17
BLOB_FORMAT = 18
SWAP_SHAPE = 19
SWAP_INDEX = 20
SWAP_EPOCH = 21
SCORER_THRESHOLD = 22
SCORER_WINDOW = 23
SCORER_BINS = 24
RECORD_ORDER = 25
QUANTISE_INPUT = 26
SEED_RANGE = 27
NOISE_SIGMA = 28
NOISE_RANGE = 29
STREAM_LENGTH = 30
PULSE_UNKNOWN = 31
INJECT_OVERLAP = 32
INJECT_PAST_END = 33
INJECT_RANGE = 34
REPLAY_FORMAT = 35
REPLAY_PROFILE = 36
REPLAY_HASH = 37
SHAPE_HIDDEN = 38
SHAPE_HIDDEN_SHIFT = 39
SHAPE_BETWEEN = 40
CORE_STOPPED = 41
REGISTER_ACCESS = 42
INJECT_PENDING = 43
KERNEL_BUSY = 44
BUFFER_ALIGN = 45
BUFFER_SIZE = 46
RUN_START = 47
RECORD_QUEUE = 48
MEMORY_WRITE = 49
RUN_LENGTH = 50

# Bounds the fabric has and the model does not: the model takes any noise
# table its profile's samples can index, and a schedule of any length. Both are
# the lead's DECISIONS of 2026-11-23, from parcel RTL-A's design; D0 states
# neither.
#   The most entries a noise table handed to the fabric may have. It is the
#   largest sample the narrowest profile holds, so under that profile the
#   fabric takes every table the model takes; under a wider one it takes fewer.
#   The most truth records the injector holds at once, not yet wholly added.
[fabric]
max_noise_table = 32767
max_inject_pending = 1024

# The memory the kernel writes score records to (round 3, parcel KRNL's design,
# entered by the lead). One record is one slot of slot_bytes: its canonical
# bytes first (the score record's fields in declared order, each little-endian,
# as model.records.pack gives them), then zeros to the slot's end, always
# written. Record n's slot begins at the buffer's base + n * slot_bytes, and the
# base is a multiple of slot_bytes. A power of two, at least the record's bytes.
[memory]
slot_bytes = 32

# The register map's frame: what the host reads and writes, and how.
#   A register is one word of word_bits at a byte offset that is a multiple of
#   the word's bytes, under address_bits of address. No register sits below
#   first_offset: those words are the kernel's own control (the sibling project's
#   kernel keeps the same frame on this card). A value wider than a word takes
#   consecutive words, its lowest bits at the lowest offset.
#   magic is what the register `id` reads: "UNDT" as ASCII.
[bus]
word_bits = 32
address_bits = 12
first_offset = 0x10
magic = 0x554E4454

# The blocks that share the register map: name = [first byte offset, end], the
# end being one past the block's last byte. Every register lies wholly inside
# exactly one block. Outside its range a block does nothing: a write is
# ignored and a read answers zero. Inside it every write is taken or refused
# by name, REGISTER_ACCESS when no other name fits, and never dropped.
[blocks]
core = [0x010, 0xE00]
kernel = [0xE00, 0xF00]
source = [0xF00, 0xF80]
inject = [0xF80, 0x1000]

# The registers: name = [byte offset, "ro" | "rw" | "wo", words].
#
# The first fifteen are the identity and capability block, all read-only. It is
# what a build says of itself: the definition it was generated from, and each
# bound it was synthesised at. A capability register holds the build's value
# of the bound it is named for; cap_rectifiers has bit c set when the build
# accepts rectifier code c, and cap_blob_versions bit v when it accepts blob
# version v.
#
# From 0x080: the detector core's control block, drawn at the design stop of
# parcel RTL-B (round 2) and entered by the lead as that design named it.
#   shape_*       the shape, written while the core is stopped; shape_masks is
#                 one word a filter, bit c for channel c, max_filters words
#   configure     its data is the count of weight words to come; checks and
#                 takes the shape
#   shadow_begin  the count again: a new stream of weight words
#   shadow_data   the window: the next weight word, in a blob's order
#   start         its data is the start epoch
#   commit_at     the index of a swap; the write of its upper word is the commit
#   status        bits, in [register_bits.status]
#   refusal       the number of the first refusal since it was cleared; a write
#                 of zero clears it. Each block has one, under this one rule
#   epoch, next_index   what the next frame taken will carry
#   shadow_count, shadow_words   words taken into the stream; words a set has
#
# From 0xF00 and from 0xF80: the source's and the injector's, drawn at the
# design stop of parcel RTL-A (round 2).
#   src_seed, src_frames         the write of src_frames' upper word starts a run
#   src_table_length             begins a new noise table of that many entries
#   src_table_entry              the write of its upper word stores the next entry
#   inj_frame                    the index the next frame taken will have; the
#                                write of its upper word begins a run
#   inj_truth_*                  a truth record, a field a row, in the record's
#                                order; the write of the denominator offers it
#   inj_pending                  truth records held
#   cap_noise_table, cap_inject_pending   the build's value of each fabric bound
#
# Under a kernel (round 3), src_frames is the kernel's to write: krn_start
# writes it from krn_frames, and a host's write of it through the kernel is
# refused, REGISTER_ACCESS, so that nothing starts the source with nobody
# collecting its records.
#
# From 0xE00: the kernel's own block, drawn at the design stop of parcel KRNL
# (round 3), taken from the end of the core's range, where the core has no row.
# The kernel's control protocol is Vitis's user-managed one, so nothing sits
# below first_offset and XRT writes no register of the kernel's.
#   krn_buffer, krn_size   the buffer's base and size in bytes
#   krn_frames             the run's length in frames: the records it must write
#   krn_start              a write of 1 starts a run, after the checks named in
#                          the kernel's design
#   krn_reset              a write of 1 resets the three blocks and the run;
#                          the arguments are kept
#   krn_status             bits, in [register_bits.krn_status]
#   krn_refusal            the kernel's refusal, under the rule every block has
#   krn_records            records written and answered, in order, from slot 0
#   krn_queue_peak         the most records the kernel's queue held in the run
#   cap_record_queue       the build's depth of that queue
[registers]
id = [0x10, "ro", 1]
spec_version = [0x14, "ro", 1]
spec_hash = [0x18, "ro", 8]
cap_sample_bits = [0x38, "ro", 1]
cap_channels = [0x3C, "ro", 1]
cap_coeff_bits = [0x40, "ro", 1]
cap_filters = [0x44, "ro", 1]
cap_taps = [0x48, "ro", 1]
cap_rows = [0x4C, "ro", 1]
cap_pool = [0x50, "ro", 1]
cap_score_shift = [0x54, "ro", 1]
cap_hidden = [0x58, "ro", 1]
cap_hidden_shift = [0x5C, "ro", 1]
cap_rectifiers = [0x60, "ro", 1]
cap_blob_versions = [0x64, "ro", 1]
shape_sample_bits = [0x080, "rw", 1]
shape_channels = [0x084, "rw", 1]
shape_filters = [0x088, "rw", 1]
shape_taps = [0x08C, "rw", 1]
shape_rectifier = [0x090, "rw", 1]
shape_score_shift = [0x094, "rw", 1]
shape_pool = [0x098, "rw", 1]
shape_hidden = [0x09C, "rw", 1]
shape_hidden_shift = [0x0A0, "rw", 1]
shape_between = [0x0A4, "rw", 1]
shape_masks = [0x0A8, "rw", 16]
configure = [0x0E8, "wo", 1]
shadow_begin = [0x0EC, "wo", 1]
shadow_data = [0x0F0, "wo", 1]
start = [0x0F4, "wo", 1]
commit_at = [0x0F8, "rw", 2]
status = [0x100, "ro", 1]
refusal = [0x104, "rw", 1]
epoch = [0x108, "ro", 1]
next_index = [0x10C, "ro", 2]
shadow_count = [0x114, "ro", 1]
shadow_words = [0x118, "ro", 1]
krn_buffer = [0xE00, "rw", 2]
krn_size = [0xE08, "rw", 2]
krn_frames = [0xE10, "rw", 2]
krn_start = [0xE18, "wo", 1]
krn_reset = [0xE1C, "wo", 1]
krn_status = [0xE20, "ro", 1]
krn_refusal = [0xE24, "rw", 1]
krn_records = [0xE28, "ro", 2]
krn_queue_peak = [0xE30, "ro", 1]
cap_record_queue = [0xE34, "ro", 1]
src_seed = [0xF00, "wo", 2]
src_frames = [0xF08, "wo", 2]
src_table_length = [0xF10, "wo", 1]
src_table_entry = [0xF14, "wo", 2]
src_status = [0xF1C, "ro", 1]
src_refusal = [0xF20, "rw", 1]
cap_noise_table = [0xF24, "ro", 1]
inj_frame = [0xF80, "wo", 2]
inj_truth_index = [0xF88, "wo", 2]
inj_truth_pulse_id = [0xF90, "wo", 1]
inj_truth_amplitude_num = [0xF94, "wo", 1]
inj_truth_amplitude_den = [0xF98, "wo", 1]
inj_pending = [0xF9C, "ro", 1]
inj_refusal = [0xFA0, "rw", 1]
cap_inject_pending = [0xFA4, "ro", 1]

# The bits of a register that is read as bits: [register_bits.<register>],
# name = bit. Every other bit of that register reads zero.
#   status: the core is running; it is loading; a commit is scheduled; outputs
#   still mix two weight sets; the shadow is closed to writes; a stream of
#   weight words is begun and not whole; a stream is whole; the overflow flag
#   has risen; a refusal is latched; more than one since it was cleared.
[register_bits.status]
running = 0
loading = 1
commit = 2
settling = 3
closed = 4
partial = 5
whole = 6
overflow = 7
refused = 8
refused_again = 9

[register_bits.src_status]
running = 0

#   krn_status: a run is going; the last run is done (it stays until the next
#   start or krn_reset, and is not cleared by a read); a refusal is latched.
[register_bits.krn_status]
running = 0
done = 1
refused = 2
